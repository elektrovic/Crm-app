# Netlify-oppsett for Montørappen.
#
# Appen ligger i undermappa `app/`, ikke i rota. `base` under forteller
# Netlify det, slik at både installasjon, bygg og funksjoner finnes uten at
# noe må settes i grensesnittet.
#
# MERK: når `base` er satt, tolkes ALLE andre stier i denne fila relativt
# til den. Derfor står det `.next` og ikke `app/.next`.

[build]
  base = "app"
  command = "npm run build"
  publish = ".next"
  # Relativt til base, altså app/netlify/functions
  functions = "netlify/functions"

# Next.js-kjøretiden, bedt om med navn.
#
# Netlify finner den vanligvis selv. Den gjorde ikke det her: første
# utrulling kom fra en opplastet pakke i stedet for fra Git, kjøretiden
# kjørte aldri, og bare de statiske filene havnet ut. Alt som rendres på
# serveren — altså nesten hele appen — svarte 404.
#
# Det er en stille feil: bygget blir grønt, og sida er død. Derfor står
# den her, så den ikke avhenger av at Netlify gjetter riktig.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  # Samme versjon som utviklingsmaskinen, så et bygg ikke plutselig
  # oppfører seg annerledes enn det som ble testet.
  NODE_VERSION = "22"

# Sikkerhetsheaderne settes i app/next.config.ts og følger med responsene
# derfra, slik at det finnes ett sted å endre dem.

# --------------------------------------------------------------- miljøer
#
# MILJO forteller appen hvilket miljø den kjører i. Vernet i
# app/src/db/vern.ts nekter å koble til produksjonsbasen når MILJO ikke
# er «produksjon», slik at test aldri kan skrive i den ekte basen.
#
# Disse gjelder under BYGGING — altså også for migreringen, som er den
# som endrer tabellene. Variablene appen leser når den KJØRER, settes per
# kontekst i Netlify sitt grensesnitt. Begge deler må på plass; se
# docs/testmiljo.md.

[context.production.environment]
  MILJO = "produksjon"

# Alle grendeployer, som i dag betyr «test»-grenen.
[context.branch-deploy.environment]
  MILJO = "test"

[context.deploy-preview.environment]
  MILJO = "test"

# `netlify dev` lokalt.
[context.dev.environment]
  MILJO = "lokal"
